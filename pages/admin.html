<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>Admin - Wlan0tto Cyber Hub</title>
    <link rel="icon" href="../icons/favicon-64.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['League Spartan', 'sans-serif'],
                        serif: ['Libre Baskerville', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        white: 'var(--color-white)',
                        black: 'var(--color-black)',
                        'accent-primary': 'var(--accent-primary)',
                        'accent-secondary': 'var(--accent-secondary)',
                        'glass-dark': 'var(--glass-dark)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex items-center justify-center">

    <!-- Login Container -->
    <div id="login-container" class="glass-card p-8 max-w-md w-full mx-4 reveal active">
        <h2 class="text-3xl font-bold text-accent-primary mb-6 text-center">System Access</h2>
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-gray-400 text-sm mb-2">Access Key</label>
                <input type="password" id="admin-key"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-primary transition"
                    placeholder="Enter security token...">
            </div>
            <button type="submit"
                class="w-full bg-accent-primary text-gray-900 font-bold py-3 rounded-lg hover:bg-accent-secondary transition">Unlock
                Console</button>
        </form>
    </div>

    <!-- Dashboard Container (Hidden by default) -->
    <div id="dashboard-container" class="hidden w-full max-w-6xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-accent-primary"><a href="../index.html" class="hover:opacity-80 transition-opacity">Cyber Hub Console</a></h1>
            <button id="logout-btn"
                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition shadow-lg">Logout</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Add Service Config -->
            <div class="glass-card p-6">
                <h3 class="text-xl font-bold mb-4">Add Custom Service</h3>
                <form id="add-service-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="service-id" placeholder="Service ID"
                            class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white" required>
                        <input type="text" id="service-price" placeholder="Price (e.g. 500.00)"
                            class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white" required>
                    </div>
                    <input type="text" id="service-title" placeholder="Service Title"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white" required>
                    <select id="service-category" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white">
                        <option value="other">General Service</option>
                        <option value="printing-binding">Printing & Binding</option>
                        <option value="branding">Branding & Apparel</option>
                        <option value="packaging">Packaging</option>
                        <option value="device">Device Setup</option>
                        <option value="media">Media Services</option>
                        <option value="documents">Document Services</option>
                        <option value="ecitizen">E-Citizen</option>
                        <option value="training">Training</option>
                    </select>
                    <textarea id="service-desc" placeholder="Service Description (Supports HTML)"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white h-24"
                        required></textarea>
                    <div class="space-y-2">
                        <label class="block text-sm text-gray-400">Service Image (Optional)</label>
                        <input type="file" id="service-img" accept="image/*"
                            class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-accent-primary file:text-gray-900 hover:file:bg-accent-secondary">
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition font-bold">Add
                        Service</button>
                </form>
            </div>

            <!-- Current Custom Services List -->
            <div class="glass-card p-6">
                <h3 class="text-xl font-bold mb-4">Active Custom Services</h3>
                <div id="custom-services-list" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- Populated by JS -->
                    <p class="text-gray-400">No custom services added yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>

</html>
